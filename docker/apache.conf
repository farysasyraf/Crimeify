# Apache for Crimeify: serves public/, and public/.htaccess sends every other address to Laravel (index.php).
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Small, safe defaults. No Content-Security-Policy and no HSTS here: both can lock out pages or a whole domain,
    # so add them once you've tried them on staging (DEPLOY.md).
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Apache already compresses pages, styles and scripts; the map's data files too, as the states' boundaries are
    # hundreds of KB, and a fraction of that compressed.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE application/json application/geo+json
    </IfModule>

    # To the container's output, where the cloud host's log stream reads them.
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
