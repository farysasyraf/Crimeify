; Crimeify's changes to PHP's production settings (php.ini-production).
expose_php = Off
display_errors = Off
log_errors = On

; The biggest uploads are a 10 MB Excel file or photo (the controllers' max rules); a little more room for the form.
upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 256M

; Reading and comparing an Excel file of every crime figure takes a while.
max_execution_time = 120

; The image never changes once built, so PHP needn't check each file for changes on every request.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
